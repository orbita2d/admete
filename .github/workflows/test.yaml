# .github/workflows/test.yaml
name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test-linux:
    name: Test Linux
    uses: ./.github/workflows/build-reusable.yaml
    with:
      platform: linux
      compiler: clang
      build_type: Release
      enable_tests: true
      artifact_name: linux-tests
      binary_name: admete

  build-windows:
    name: Build Windows (clang/mingw)
    uses: ./.github/workflows/build-reusable.yaml
    with:
      platform: windows
      # clang, not gcc: the mingw-w64 gcc on the runners is v13, too old for the
      # #embed weights (needs gcc >= 15 / clang >= 19).
      compiler: clang
      build_type: Release
      enable_tests: true
      # Portable, non-VNNI: this binary is executed on the windows-latest runner,
      # which may not support AVX-VNNI.
      target_arch: x86-64-v3
      artifact_name: windows-tests
      binary_name: tests

  test-windows:
    name: Test Windows (clang/mingw)
    needs: build-windows
    runs-on: windows-latest
    
    steps:
    - name: Download Windows Binary
      uses: actions/download-artifact@v4
      with:
        name: windows-tests
    
    - name: Test Windows Binary
      run: .\tests_windows_x86-64-v3.exe