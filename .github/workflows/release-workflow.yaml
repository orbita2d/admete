# .github/workflows/release.yaml
name: Release Build

on:
  release:
    types: [created]
  # Allow building the binaries on demand (e.g. to hand off for benchmarking)
  # without cutting a real release. Artifacts are downloadable from the run.
  workflow_dispatch: {}

jobs:
  build-release:
    strategy:
      matrix:
        include:
          # AVX2 + AVX-VNNI (fast; Alder Lake / Zen 4+)
          - platform: linux
            target_arch: x86-64-v3-vnni
          - platform: windows
            target_arch: x86-64-v3-vnni
          # AVX2, no VNNI (portable fallback; dpbusd emulation, any 2013+ CPU)
          - platform: linux
            target_arch: x86-64-v3
          - platform: windows
            target_arch: x86-64-v3

    name: Build ${{ matrix.platform }} ${{ matrix.target_arch }}
    uses: ./.github/workflows/build-reusable.yaml
    with:
      platform: ${{ matrix.platform }}
      compiler: clang
      build_type: Release
      enable_tests: false
      target_arch: ${{ matrix.target_arch }}
      artifact_name: ${{ matrix.platform }}-${{ matrix.target_arch }}
      binary_name: admete

  upload-release-assets:
    name: Upload Release Assets
    needs: build-release
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    
    steps:
    - name: Download All Artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Prepare Release Assets
      run: |
        VERSION="${{ github.event.release.tag_name }}"
        VERSION=${VERSION#v}  # Remove 'v' prefix if present
        
        mkdir -p release
        
        # Process all artifacts and rename with version after admete_
        for artifact_dir in artifacts/*/; do
          for file in "$artifact_dir"*; do
            if [ -f "$file" ] && [[ "$(basename "$file")" != "MANIFEST.txt" ]]; then
              filename=$(basename "$file")
              
              # Remove 'admete_' prefix and get the rest
              if [[ "$filename" == admete_* ]]; then
                suffix="${filename#admete_}"
                
                # Reconstruct with version right after admete_
                if [[ "$filename" == *.exe ]]; then
                  # For .exe files, remove .exe, add version, then add .exe back
                  suffix_no_ext="${suffix%.exe}"
                  new_name="admete_${VERSION}_${suffix_no_ext}.exe"
                else
                  # For other files (like .so), just insert version
                  new_name="admete_${VERSION}_${suffix}"
                fi
                
                cp "$file" "release/$new_name"
                echo "Renamed: $filename -> $new_name"
              else
                # Fallback for files not starting with admete_
                cp "$file" "release/$filename"
                echo "Copied unchanged: $filename"
              fi
            fi
          done
        done
        
        # List what we're uploading
        echo "Release assets:"
        ls -la release/
    
    - name: Upload Release Assets
      uses: softprops/action-gh-release@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        files: release/*